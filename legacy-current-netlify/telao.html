<!DOCTYPE html>
<html lang="pt-BR"><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0e0e0e;--card2:#1a1a1a;--gold:#c8921a;--gold2:#e2ae3a;--red:#b3261e;--green:#2ecc71;--blue:#3498db;--txt:#f2f2f2;--mut:#9a9a9a;--bd:#2a2a2a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
h1,h2,h3{margin:0}
h1,h2,.anton{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.logo{width:96px;height:96px;border-radius:50%;display:block}
.board{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:12px}
.bc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.bc.now{border-color:var(--gold);box-shadow:0 0 36px #c8921a33}
.bl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.bm{font:400 22px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;overflow-wrap:anywhere}.bc.now .bm{font-size:28px}
.bn{color:var(--txt);margin-top:4px}.bt{color:var(--gold2);font-weight:800;margin-top:2px}
@media(max-width:760px){.board{grid-template-columns:1fr}.bc.now{order:-1}}
a{color:var(--gold2)}
.btn{border:1px solid var(--bd);background:var(--card2);color:var(--txt);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a8841c);color:#111;border-color:transparent}
.btn-red{background:var(--red);border-color:transparent}
.btn-green{background:#1e8f4f;border-color:transparent}
.btn-sm{padding:6px 10px;font-size:13px}
input[type=text],input[type=number],input[type=url],input:not([type]){width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:#0f0f13;color:var(--txt);font-size:16px}
input:focus{outline:2px solid var(--gold);border-color:transparent}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#2a2a33;color:var(--mut)}
.pill.ABERTO,.pill.EM_PALCO{background:#143d27;color:var(--green)}
.pill.INSCRICOES_FECHADAS,.pill.PENDENTE{background:#4a3b10;color:var(--gold2)}
.pill.ENCERRADO,.pill.CANCELADA,.pill.FECHADO{background:#4a1b17;color:#ff8c80}
.pill.CANTADA{background:#16324a;color:#7cc4f5}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#222;border:1px solid var(--gold);padding:11px 18px;border-radius:12px;box-shadow:0 6px 24px #000a;max-width:90vw}
.toast.err{border-color:var(--red);background:#2a1210}
.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;max-width:440px;width:100%}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
</style>

<style>
html,body{height:100%;overflow:hidden}
.tv{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:2vw;padding:2.4vw}
.top{display:flex;align-items:center;gap:2vw}.top .logo{width:10vw;height:10vw;min-width:90px;min-height:90px}
.top h1{font-size:5vw;line-height:1}.top .sub{color:var(--gold);font-size:1.8vw}
.tv .board{gap:1.8vw;align-items:stretch}.tv .bc{padding:2vw;display:flex;flex-direction:column;justify-content:center;border-radius:16px}
.tv .bl{font-size:1.3vw}.tv .bm{font-size:3.6vw}.tv .bc.now .bm{font-size:5.6vw}.tv .bn{font-size:2vw}.tv .bt{font-size:2.6vw;font-family:Anton,Impact,sans-serif;font-weight:400}
.foot{display:flex;align-items:center;gap:2vw;font-size:1.8vw;color:var(--mut)}
.foot b{font:400 5vw Anton,Impact,sans-serif;color:#fff}.foot .bar{flex:1;height:.9vw;background:#222;border-radius:99px;overflow:hidden}
.foot .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .6s}
@media(max-width:760px){html,body{overflow:auto}.tv{height:auto}.top h1{font-size:34px}.tv .bm,.tv .bc.now .bm{font-size:28px}.tv .bl,.tv .bn,.tv .bt,.foot{font-size:16px}.foot b{font-size:34px}}
</style></head>

<script>
function api_call(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();});}
function call_(fn){var a=[].slice.call(arguments,1);return api_call(fn,a);}
</script>
<script>
function boardHtml_(u,a,p,com){
  function c(t,x,cls){return '<div class="bc '+(cls||'')+'"><div class="bl">'+t+'</div>'+(x?'<div class="bm">'+esc_(x.musica)+'</div><div class="bn">'+esc_(x.nomes)+'</div><div class="bt">'+esc_(x.mesa)+(com&&x.comanda?' • Comanda '+esc_(x.comanda):'')+'</div>':'<div class="bm" style="color:var(--mut)">—</div>')+'</div>';}
  return c('Última cantada',u)+c('Tocando agora',a,'now')+c('Próxima',p);
}
function esc_(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast_(msg,erro){
  var box=document.getElementById('toast');
  if(!box){box=document.createElement('div');box.id='toast';document.body.appendChild(box);}
  var t=document.createElement('div');t.className='toast'+(erro?' err':'');t.textContent=msg;box.appendChild(t);
  setTimeout(function(){t.remove();},erro?6000:3200);
}
/** Confirmação própria (confirm() nativo é bloqueado em iframes). opts.input => pede um texto. */
function confirm_(msg,opts){
  opts=opts||{};
  return new Promise(function(res){
    var o=document.createElement('div');o.className='overlay';
    o.innerHTML='<div class="modal"><div style="white-space:pre-line">'+esc_(msg)+'</div>'+
      (opts.input?'<input type="text" id="cfIn" maxlength="60" placeholder="'+esc_(opts.placeholder||'')+'" style="margin-top:12px">':'')+
      '<div class="row"><button class="btn" id="cfNo">Voltar</button><button class="btn '+(opts.danger?'btn-red':'btn-gold')+'" id="cfYes">'+esc_(opts.ok||'Confirmar')+'</button></div></div>';
    document.body.appendChild(o);
    function fim(v){o.remove();res(v);}
    o.querySelector('#cfNo').onclick=function(){fim(null);};
    o.querySelector('#cfYes').onclick=function(){fim(opts.input?(o.querySelector('#cfIn').value||''):true);};
    var inp=o.querySelector('#cfIn'); if(inp) inp.focus();
  });
}
</script>

<script>
function $(i){return document.getElementById(i);}
function tick(){
  if(document.hidden) return;
  call_('publicTelao').then(function(s){
    if(!s||!s.ok) return;
    $('board').innerHTML=boardHtml_(s.ultima,s.atual,s.proxima,false);
    $('disp').textContent=s.disponiveis;$('cap').textContent=s.capacidade;$('ev').textContent=s.evento||'';
    $('barra').style.width=(s.capacidade?Math.max(0,Math.min(100,(s.capacidade-s.disponiveis)/s.capacidade*100)):0)+'%';
  }).catch(function(){});
}
tick();setInterval(tick,5000);
</script></body></html>
