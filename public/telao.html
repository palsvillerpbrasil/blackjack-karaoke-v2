<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Karaokê BLACK JACK — Telão</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"><style>
:root{--gold:#c8922a;--gold2:#f0c76d;--bg:#050505}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#281d0b 0,#050505 58%);color:#fff;font-family:Montserrat,Arial,sans-serif;overflow:hidden}.wrap{width:100%;min-height:100vh;padding:2vh 3vw;display:flex;flex-direction:column}.brand{text-align:center}.brand img{max-height:11vh;max-width:140px;object-fit:contain;display:block;margin:0 auto 4px}.brand .karaoke{font:clamp(35px,5vw,74px) Anton;color:var(--gold2);letter-spacing:3px;line-height:.95}.brand .blackjack{font:clamp(27px,3.5vw,52px) Anton;letter-spacing:5px;line-height:1.05}.brand .sub{font:clamp(14px,1.5vw,22px) 'Dancing Script',cursive;color:var(--gold2);margin-top:4px}.event{color:#aaa;text-align:center;letter-spacing:3px;font-size:clamp(10px,1vw,15px);margin:1.5vh 0 2vh}.board{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:1.5vw;flex:1;align-items:stretch}.slot{background:linear-gradient(145deg,#1d1d1d,#101010);border:1px solid #3a3a3a;border-radius:18px;padding:2.2vw;display:flex;flex-direction:column;justify-content:center;text-align:center;min-width:0}.slot.current{border:2px solid var(--gold);background:linear-gradient(145deg,#34240e,#17120a);box-shadow:0 0 35px #c8922a25}.slot .label{color:var(--gold2);font:clamp(17px,2vw,30px) Anton;letter-spacing:1px;margin-bottom:2vh}.song{font:clamp(21px,2.6vw,42px) Anton;overflow-wrap:anywhere}.slot.current .song{font-size:clamp(28px,3.5vw,58px);color:#fff}.people{font-size:clamp(13px,1.3vw,20px);color:#ccc;margin-top:2vh;line-height:1.5}.table{color:var(--gold2);font-weight:800;margin-top:1vh;font-size:clamp(14px,1.5vw,23px)}.raffle{position:fixed;inset:0;background:radial-gradient(ellipse at center,#33230c 0,#080808 72%);z-index:5;display:flex;flex-direction:column;padding:4vh 4vw}.raffle.hidden{display:none}.raffleTitle{text-align:center;color:var(--gold2);font:clamp(35px,6vw,86px) Anton;letter-spacing:3px}.raffleSubtitle{text-align:center;color:#eee;font-size:clamp(12px,1.5vw,20px);margin:1vh 0 3vh}.raffleContent{display:grid;grid-template-columns:1.1fr minmax(280px, .9fr);gap:3vw;flex:1;min-height:0}.spinBox{border:2px solid var(--gold);border-radius:20px;background:#100e0a;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:3vw;box-shadow:0 0 45px #c8922a30}.spinLabel{font-size:clamp(12px,1.2vw,18px);color:#aaa;letter-spacing:3px}.spinName{font:clamp(34px,5vw,70px) Anton;color:#fff;text-align:center;margin:2vh 0;overflow-wrap:anywhere}.spinSong{color:var(--gold2);font-size:clamp(13px,1.4vw,20px);text-align:center}.winnerList{display:flex;flex-direction:column;justify-content:center;gap:12px}.winnerCard{background:linear-gradient(110deg,#34240e,#17120a);border:1px solid var(--gold);border-radius:15px;padding:2vh 2vw;animation:arrive .6s ease both}.winnerCard .rank{color:var(--gold2);font:clamp(15px,1.7vw,26px) Anton}.winnerCard .name{font:clamp(27px,3.2vw,48px) Anton;overflow-wrap:anywhere}.winnerCard .song{font:600 clamp(12px,1.2vw,18px) Montserrat;color:#ddd}.winnerCard .table{font-size:clamp(12px,1.2vw,18px);margin-top:5px}@keyframes arrive{from{opacity:0;transform:translateX(-50px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}.footer{text-align:center;color:#6e6e6e;font-size:10px;letter-spacing:3px;padding-top:1.5vh}@media(max-width:800px){.board{grid-template-columns:1fr;gap:1vh}.slot{padding:1.5vh;min-height:18vh}.raffleContent{grid-template-columns:1fr;grid-template-rows:.7fr 1.3fr}.spinBox{padding:1vh}.winnerList{overflow:auto}.wrap{overflow:auto}}
</style></head><body><main class="wrap"><header class="brand"><img src="/assets/logo-original.png" alt="Logo original BLACK JACK" onerror="this.style.display='none'"><div class="karaoke">KARAOKÊ</div><div class="blackjack">BLACK JACK</div><div class="sub">Sua vez de brilhar!</div></header><div class="event" id="eventName">NOITE DE KARAOKÊ</div><section class="board"><article class="slot"><div class="label">ÚLTIMA CANTADA</div><div class="song" id="lastSong">—</div><div class="people" id="lastPeople"></div><div class="table" id="lastTable"></div></article><article class="slot current"><div class="label">TOCANDO AGORA</div><div class="song" id="currentSong">—</div><div class="people" id="currentPeople"></div><div class="table" id="currentTable"></div></article><article class="slot"><div class="label">PRÓXIMA</div><div class="song" id="nextSong">—</div><div class="people" id="nextPeople"></div><div class="table" id="nextTable"></div></article></section><div class="footer">BLACK JACK • KARAOKÊ</div></main>
<section class="raffle hidden" id="raffle"><div class="raffleTitle">HORA DO SORTEIO!</div><div class="raffleSubtitle">Boa sorte! Os nomes estão sendo escolhidos…</div><div class="raffleContent"><div class="winnerList" id="winnerList"></div><div class="spinBox"><div class="spinLabel">SORTEANDO PARTICIPANTE</div><div class="spinName" id="spinName">BOA SORTE!</div><div class="spinSong" id="spinSong">Aguarde o resultado</div></div></div></section>
<script>
const $=id=>document.getElementById(id);let lastRaffleId=null;let spinTimer=null;let cachedCandidates=[];let currentRaffle=null;
async function api(){const r=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'public.screenStatus'})});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Falha ao atualizar telão');return j}
function showSlot(prefix,p){$(prefix+'Song').textContent=p?.song||'—';$(prefix+'People').textContent=p?[p.p1,p.p2,p.p3].filter(Boolean).join(' • '):'';$(prefix+'Table').textContent=p?`MESA ${p.table_number}`:''}
function startSpin(candidates){cachedCandidates=(candidates||[]).filter(x=>x.name);if(spinTimer)clearInterval(spinTimer);spinTimer=setInterval(()=>{if(!cachedCandidates.length)return;const p=cachedCandidates[Math.floor(Math.random()*cachedCandidates.length)];$('spinName').textContent=p.name;$('spinSong').textContent=`${p.song||''} • MESA ${p.table_number||''}`},95)}
function showWinners(winners){if(spinTimer){clearInterval(spinTimer);spinTimer=null}$('winnerList').innerHTML=(winners||[]).map(w=>`<div class="winnerCard"><div class="rank">${w.position}º SORTEADO</div><div class="name">${escapeHtml(w.participant_name)}</div><div class="song">${escapeHtml(w.song)}</div><div class="table">MESA ${w.table_number}</div></div>`).join('');if(winners?.length){$('spinName').textContent='PARABÉNS!';$('spinSong').textContent='Confira os participantes sorteados';}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function tick(){try{const s=await api();$('eventName').textContent=s.event?.name||'NOITE DE KARAOKÊ';showSlot('last',s.last);showSlot('current',s.current);showSlot('next',s.next);if(s.raffle){$('raffle').classList.remove('hidden');if(lastRaffleId!==s.raffle.id){lastRaffleId=s.raffle.id;$('winnerList').innerHTML='';$('spinName').textContent='BOA SORTE!';startSpin(s.raffle.spinCandidates||[])}if(s.raffle.revealed){showWinners(s.raffle.winners||[])}}else{$('raffle').classList.add('hidden');if(spinTimer){clearInterval(spinTimer);spinTimer=null}lastRaffleId=null}}catch(e){$('eventName').textContent='BLACK JACK KARAOKÊ'}}tick();setInterval(()=>{if(!document.hidden)tick()},2000);
</script></body></html>
