<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Jack — Telão</title><style>body{background:#050505;color:white;font:2vw Arial;margin:0;padding:3vw;text-align:center}.gold{color:#c8922a}.board{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:2vw;margin-top:8vh}.slot{background:#171717;border:1px solid #333;padding:3vw;border-radius:15px}.now{border-color:#c8922a;font-size:1.3em}@media(max-width:700px){.board{grid-template-columns:1fr}body{font-size:16px}}</style></head><body><h1 class="gold">BLACK JACK KARAOKÊ</h1><div id="event"></div><div class="board"><div class="slot">ÚLTIMA CANTADA<h2 id="last">—</h2></div><div class="slot now">TOCANDO AGORA<h1 id="current">—</h1></div><div class="slot">PRÓXIMA<h2 id="next">—</h2></div></div><script>async function tick(){try{let r=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'public.status',token:''})});let s=await r.json();document.getElementById('event').textContent=s.event||'';for(let k of ['last','current','next']){let x=s[k];document.getElementById(k).textContent=x?`${x.song} — ${x.p1} • Mesa ${x.table_number}`:'—'}}catch(e){}}tick();setInterval(tick,5000)</script></body></html>
