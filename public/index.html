<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Jack Karaokê</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet"><style>
:root{--gold:#c8922a;--bg:#080808;--card:#151515;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px Montserrat,Arial}.wrap{max-width:560px;margin:auto;padding:22px}.brand{text-align:center;color:var(--gold);font:38px Anton}.card{background:var(--card);border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}.board{display:grid;gap:8px}.slot{padding:12px;background:#202020;border-radius:10px}.slot strong{color:var(--gold)}label{display:block;margin:12px 0 5px;color:#ccc}input{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#090909;color:white;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--gold);font-weight:800;font-size:16px;margin-top:15px}small{color:var(--muted)}#msg{margin-top:12px;line-height:1.5}</style></head><body><main class="wrap"><div class="brand">BLACK JACK</div><p style="text-align:center">TAP HOUSE • KARAOKÊ</p><section class="card"><div id="event">Carregando evento…</div><div class="board"><div class="slot"><small>Última cantada</small><div id="last">—</div></div><div class="slot"><strong>TOCANDO AGORA</strong><div id="current">—</div></div><div class="slot"><small>Próxima</small><div id="next">—</div></div></div><p><strong id="available">—</strong> apresentações disponíveis</p></section><section class="card"><label>Comanda</label><input id="tab" maxlength="10" autocomplete="off"><label>Seu nome</label><input id="p1" maxlength="70"><label>Participante 2 (opcional)</label><input id="p2" maxlength="70"><label>Participante 3 (opcional)</label><input id="p3" maxlength="70"><label>Nome da música</label><input id="song" maxlength="150"><button id="send">Enviar apresentação</button><div id="msg"></div><small>A comanda e o cadastro valem somente para esta noite.</small></section></main><script>
const token=new URLSearchParams(location.search).get('m')||'';const $=id=>document.getElementById(id);const req=()=>crypto.randomUUID();
async function api(action,data={}){const r=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Falha na operação');return j}
function show(x){return x?`${x.song} — ${[x.p1,x.p2,x.p3].filter(Boolean).join(', ')} • Mesa ${x.table_number}`:'—'}
async function refresh(){try{const s=await api('public.status',{token});$('event').textContent=s.event||'Evento fechado';$('last').textContent=show(s.last);$('current').textContent=show(s.current);$('next').textContent=show(s.next);$('available').textContent=s.available??0;}catch(e){$('event').textContent=e.message}}
$('send').onclick=async()=>{try{$('send').disabled=true;$('msg').textContent='Enviando…';const r=await api('public.register',{token,tab:$('tab').value,p1:$('p1').value,p2:$('p2').value,p3:$('p3').value,song:$('song').value,requestId:req()});$('msg').textContent='Apresentação enviada! Aguarde sua vez.';$('p2').value='';$('p3').value='';$('song').value='';await refresh()}catch(e){$('msg').textContent=e.message}finally{$('send').disabled=false}};
refresh();setInterval(()=>{if(!document.hidden)refresh()},12000);
</script></body></html>
