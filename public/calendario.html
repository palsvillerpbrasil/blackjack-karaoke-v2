<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808">
<title>Próximos Karaokês — BLACK JACK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c8922a;--gold2:#e4b75d;--bg:#080808;--panel:#171717;--line:#44351e;--muted:#aaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#241b0c 0,#080808 58%);color:#fff;font:14px Montserrat,Arial,sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:26px 16px 48px}.brand{text-align:center;padding:8px 0 23px;border-bottom:1px solid #3a2d17}.brand img{max-width:105px;max-height:85px;object-fit:contain;display:block;margin:0 auto 7px}.brand .karaoke{font:42px Anton;color:var(--gold2);letter-spacing:2px;line-height:1}.brand .blackjack{font:31px Anton;letter-spacing:3px;margin-top:2px}.brand .sub{font:20px 'Dancing Script',cursive;color:var(--gold2);margin-top:5px}.panel{background:linear-gradient(145deg,#1c1c1c,#111);border:1px solid var(--line);border-radius:19px;padding:22px;margin-top:20px;box-shadow:0 14px 34px #0006}.eyebrow{text-align:center;color:var(--gold2);font-size:10px;font-weight:800;letter-spacing:2.5px}.heading{font:30px Anton;text-align:center;color:var(--gold2);letter-spacing:1px;margin:8px 0 5px}.intro{text-align:center;color:#aaa;font-size:12px;line-height:1.6;margin:0 0 20px}.events{display:grid;gap:12px}.event{display:grid;grid-template-columns:74px 1fr;gap:15px;align-items:center;padding:15px;background:linear-gradient(120deg,#292116,#1b1b1b);border:1px solid #60451f;border-radius:14px}.date{background:#0d0d0d;border:1px solid #8b6429;border-radius:11px;text-align:center;padding:9px 5px}.date .day{font:32px Anton;color:var(--gold2);line-height:1}.date .month{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;margin-top:5px}.date .weekday{font-size:9px;color:#aaa;text-transform:uppercase;margin-top:3px}.event h2{font-size:16px;margin:0 0 7px;color:#fff}.event .when{color:var(--gold2);font-weight:800;font-size:11px;letter-spacing:.3px}.event .presenter{color:#ddd;font-size:11px;margin-top:7px}.event .presenter b{color:var(--gold2)}.empty{padding:32px 18px;text-align:center;color:#bbb;background:#171717;border:1px dashed #5b4829;border-radius:14px;line-height:1.7}.footer{text-align:center;color:#777;font-size:10px;letter-spacing:2px;padding:24px 0}.hidden{display:none!important}@media(max-width:480px){.wrap{padding:17px 12px 35px}.panel{padding:16px}.heading{font-size:26px}.event{grid-template-columns:64px 1fr;gap:11px;padding:12px}.date .day{font-size:28px}.event h2{font-size:14px}}
</style>
</head>
<body><main class="wrap">
<header class="brand"><img src="/assets/logo-original.png" alt="BLACK JACK" onerror="this.style.display='none'"><div class="karaoke">KARAOKÊ</div><div class="blackjack">BLACK JACK</div><div class="sub">Sua vez de brilhar!</div></header>
<section class="panel"><div class="eyebrow">AGENDA OFICIAL</div><h1 class="heading">PRÓXIMOS KARAOKÊS</h1><p class="intro">Confira as próximas noites, programe-se e venha soltar a voz com a gente!</p><div class="events" id="events"></div><div class="empty hidden" id="empty">Ainda não há próximas datas divulgadas.<br>Volte em breve para conferir a programação!</div></section>
<div class="footer">BLACK JACK • KARAOKÊ</div></main>
<script>
const $=id=>document.getElementById(id);let events=[];
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayKey(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return o.year+'-'+o.month+'-'+o.day}
function render(){const upcoming=events.filter(e=>e.has_karaoke!==false&&e.event_date>=todayKey()).sort((a,b)=>a.event_date.localeCompare(b.event_date));$('events').innerHTML=upcoming.map(e=>{const d=new Date(e.event_date+'T12:00:00');const weekday=d.toLocaleDateString('pt-BR',{weekday:'long'});const day=d.toLocaleDateString('pt-BR',{day:'2-digit'});const month=d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');const rawTime=(e.start_time||'19:00').slice(0,5);const [hour,minute]=rawTime.split(':');const timeLabel=minute==='00'?hour+'H':hour+'H'+minute;return `<article class="event"><div class="date"><div class="day">${day}</div><div class="month">${escapeHtml(month)}</div><div class="weekday">${escapeHtml(weekday)}</div></div><div><h2>${escapeHtml(e.title||'Karaokê')}</h2><div class="when">${escapeHtml(weekday.toLocaleUpperCase('pt-BR'))}, ${day} DE ${escapeHtml(d.toLocaleDateString('pt-BR',{month:'long'}).toLocaleUpperCase('pt-BR'))} ÀS ${escapeHtml(timeLabel)}</div>${e.presenter_name?`<div class="presenter">Apresentador: <b>${escapeHtml(e.presenter_name)}</b></div>`:''}</div></article>`}).join('');$('empty').classList.toggle('hidden',upcoming.length>0)}
async function load(){try{const r=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'public.calendar.list'})});const x=await r.json();if(!r.ok||x.ok===false)throw Error(x.error||'Não foi possível carregar a programação.');events=x.events||[];render()}catch(e){$('empty').textContent=e.message;$('empty').classList.remove('hidden')}}
load();setInterval(load,60000);
</script></body></html>
