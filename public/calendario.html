<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Calendário de Karaokê — BLACK JACK</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"><style>
:root{--gold:#c8922a;--gold2:#e4b75d;--bg:#080808;--panel:#151515;--line:#383838;--muted:#aaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#241b0c 0,#080808 55%);color:#fff;font:14px Montserrat,Arial,sans-serif}.wrap{width:min(920px,100%);margin:auto;padding:24px 16px 50px}.brand{text-align:center;padding:10px 0 24px;border-bottom:1px solid #3a2d17}.brand img{max-width:100px;max-height:82px;object-fit:contain;display:block;margin:0 auto 7px}.brand .karaoke{font:40px Anton;color:var(--gold2);letter-spacing:2px;line-height:1}.brand .blackjack{font:30px Anton;letter-spacing:3px;margin-top:3px}.brand .sub{font:20px 'Dancing Script',cursive;color:var(--gold2);margin-top:5px}.panel{background:linear-gradient(145deg,#1c1c1c,#111);border:1px solid #3d321f;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 12px 30px #0005}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.month{font:25px Anton;color:var(--gold2);text-transform:capitalize}.actions,.views{display:flex;gap:7px}.button{background:var(--gold);color:#140f07;border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{background:#292929;color:#fff;border:1px solid #494949}.button.active{background:var(--gold);color:#140f07}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:15px}.weekday{text-align:center;color:var(--gold2);font-size:10px;font-weight:800;padding:7px 1px}.day{min-height:86px;background:#1b1b1b;border:1px solid #343434;border-radius:10px;padding:8px;overflow:hidden}.day.muted{opacity:.25}.day.event{background:#2b2110;border-color:#9c7028}.day strong{font-size:12px}.day small{display:block;color:var(--gold2);font-size:9px;line-height:1.3;margin-top:6px;overflow-wrap:anywhere}.list{display:grid;gap:10px;margin-top:16px}.event-card{display:flex;align-items:center;gap:15px;background:#1c1c1c;border:1px solid #45351b;border-radius:13px;padding:14px}.datebox{min-width:62px;text-align:center;background:#2b2110;border:1px solid #77551e;border-radius:10px;padding:9px 6px}.datebox b{display:block;font:26px Anton;color:var(--gold2)}.datebox span{font-size:9px;color:#ddd;text-transform:uppercase}.event-card h3{margin:0;color:#fff;font-size:14px}.event-card p{margin:5px 0 0;color:#aaa;font-size:11px}.presenter{margin-top:7px;color:#e4b75d;font-size:11px;font-weight:700}.empty{color:#aaa;text-align:center;padding:28px 12px}.hidden{display:none!important}.footer{text-align:center;color:#777;font-size:10px;letter-spacing:2px;padding:25px 0}@media(max-width:560px){.wrap{padding:15px 11px 35px}.calendar{gap:4px}.day{min-height:67px;padding:5px}.day small{font-size:8px}.month{font-size:21px}.panel{padding:13px}.event-card{gap:10px;padding:11px}}
</style></head><body><main class="wrap"><header class="brand"><img src="/assets/logo-original.png" alt="BLACK JACK" onerror="this.style.display='none'"><div class="karaoke">KARAOKÊ</div><div class="blackjack">BLACK JACK</div><div class="sub">Sua vez de brilhar!</div></header><section class="panel"><div class="bar"><div><div class="month" id="monthTitle">Carregando…</div><div style="color:#aaa;font-size:11px">Confira as próximas noites de karaokê.</div></div><div class="actions"><button class="button secondary" id="prev">‹</button><button class="button" id="today">Hoje</button><button class="button secondary" id="next">›</button></div></div><div class="views" style="margin-top:16px"><button class="button active" id="monthView">Calendário</button><button class="button secondary" id="listView">Próximos eventos</button></div><div class="calendar" id="calendar"></div><div class="list hidden" id="eventsList"></div><div class="empty hidden" id="empty">Ainda não há karaokês programados para este período.</div></section><div class="footer">BLACK JACK • KARAOKÊ</div></main>
<script>
const $=id=>document.getElementById(id);let events=[];let cursor=new Date();let mode='month';
async function load(){try{const r=await fetch('/api/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'public.calendar.list'})});const x=await r.json();if(!r.ok||x.ok===false)throw Error(x.error||'Não foi possível carregar a programação.');events=x.events||[];render()}catch(e){$('monthTitle').textContent='Programação indisponível';$('empty').textContent=e.message;$('empty').classList.remove('hidden')}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayKey(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return o.year+'-'+o.month+'-'+o.day}
function render(){const y=cursor.getFullYear(),m=cursor.getMonth();$('monthTitle').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(cursor);$('calendar').classList.toggle('hidden',mode!=='month');$('eventsList').classList.toggle('hidden',mode!=='list');$('monthView').classList.toggle('active',mode==='month');$('listView').classList.toggle('active',mode==='list');$('monthView').classList.toggle('secondary',mode!=='month');$('listView').classList.toggle('secondary',mode!=='list');const byDate=new Map(events.map(e=>[e.event_date,e]));const offset=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate(),cells=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>'<div class="weekday">'+x+'</div>'),total=Math.ceil((offset+count)/7)*7;for(let i=0;i<total;i++){const day=i-offset+1;if(day<1||day>count){cells.push('<div class="day muted"></div>');continue}const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),e=byDate.get(date);cells.push('<div class="day '+(e?'event':'')+'"><strong>'+day+'</strong>'+(e?'<small>'+escapeHtml(e.title||'Karaokê')+'</small>'+(e.presenter_name?'<small>🎤 '+escapeHtml(e.presenter_name)+'</small>':''):'')+'</div>')}$('calendar').innerHTML=cells.join('');const upcoming=events.filter(e=>e.event_date>=todayKey()).sort((a,b)=>a.event_date.localeCompare(b.event_date));$('eventsList').innerHTML=upcoming.map(e=>{const d=new Date(e.event_date+'T12:00:00');return '<article class="event-card"><div class="datebox"><b>'+d.toLocaleDateString('pt-BR',{day:'2-digit'})+'</b><span>'+d.toLocaleDateString('pt-BR',{month:'short'})+'</span></div><div><h3>'+escapeHtml(e.title||'Karaokê')+'</h3><p>'+d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+'</p>'+(e.presenter_name?'<div class="presenter">🎤 APRESENTAÇÃO: '+escapeHtml(e.presenter_name)+'</div>':'')+'</div></article>'}).join('');$('empty').classList.toggle('hidden',mode==='month'?events.filter(e=>e.event_date.startsWith(y+'-'+String(m+1).padStart(2,'0'))).length>0:upcoming.length>0)}
$('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('today').onclick=()=>{cursor=new Date();render()};$('monthView').onclick=()=>{mode='month';render()};$('listView').onclick=()=>{mode='list';render()};load();
</script></body></html>
